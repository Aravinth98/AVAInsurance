<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://assets.adobedtm.com/4fa03d1212c6/e3ba2fb5348b/launch-a8f139d8b4e9-development.min.js" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f3f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .form-wrap {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border: 1px solid #e5e4ed;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 4px 24px rgba(83,71,183,0.07);
    }

    .form-header { margin-bottom: 1.75rem; }
    .form-title { font-size: 22px; font-weight: 600; color: #18171f; }
    .form-sub { font-size: 14px; color: #7b7a8e; margin-top: 4px; }

    .field { margin-bottom: 1.1rem; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #5a5870;
      margin-bottom: 5px;
    }

    .input-icon { position: relative; }
    .input-icon i {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #a8a7bb;
      pointer-events: none;
    }
    .input-icon input { padding-left: 36px; }

    .field input,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #dddce8;
      border-radius: 8px;
      outline: none;
      color: #18171f;
      background: #fff;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #5347B7;
      box-shadow: 0 0 0 3px rgba(83,71,183,0.12);
    }

    .field textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    .error-msg {
      font-size: 11px;
      color: #d94040;
      margin-top: 4px;
      display: none;
    }

    .field.has-error input,
    .field.has-error textarea { border-color: #d94040; }
    .field.has-error .error-msg { display: block; }

    .btn-submit {
      width: 100%;
      padding: 11px;
      background: #5347B7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 0.25rem;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover { background: #4439a8; }
    .btn-submit:active { transform: scale(0.98); }

    .success-banner {
      display: none;
      background: #e8f7ef;
      border: 1px solid #6fcf97;
      border-radius: 8px;
      padding: 13px 16px;
      margin-bottom: 1.25rem;
      font-size: 14px;
      color: #1a7a47;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="form-wrap">

  <div class="success-banner" id="successBanner">
    <i class="ti ti-circle-check" style="font-size:18px"></i>
    Message sent! We'll get back to you soon.
  </div>

  <div class="form-header">
    <h1 class="form-title">Get in touch</h1>
    <p class="form-sub">Fill in the form below and we'll respond shortly.</p>
  </div>

  <div class="field" id="field-name">
    <label for="name">Name</label>
    <div class="input-icon">
      <i class="ti ti-user"></i>
      <input type="text" id="name" placeholder="Your full name" autocomplete="name" />
    </div>
    <p class="error-msg">Please enter your name.</p>
  </div>

  <div class="field" id="field-email">
    <label for="email">Email</label>
    <div class="input-icon">
      <i class="ti ti-mail"></i>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <p class="error-msg">Enter a valid email address.</p>
  </div>

  <div class="field" id="field-phone">
    <label for="phone">Phone</label>
    <div class="input-icon">
      <i class="ti ti-phone"></i>
      <input type="tel" id="phone" placeholder="+1 (555) 000-0000" autocomplete="tel" />
    </div>
    <p class="error-msg">Enter a valid phone number.</p>
  </div>

  <div class="field" id="field-message">
    <label for="message">Message</label>
    <textarea id="message" placeholder="Write your message here…"></textarea>
    <p class="error-msg">Please enter a message.</p>
  </div>

  <button class="btn-submit" onclick="handleSubmit()">
    <i class="ti ti-send"></i> Submit
  </button>

</div>

<script>
  function setError(id) { document.getElementById(id).classList.add('has-error'); }
  function clearError(id) { document.getElementById(id).classList.remove('has-error'); }

  function handleSubmit() {
    const ids = ['field-name', 'field-email', 'field-phone', 'field-message'];
    ids.forEach(clearError);

    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const message = document.getElementById('message').value.trim();

    let valid = true;

    if (!name)                                                    { setError('field-name');    valid = false; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))     { setError('field-email');   valid = false; }
    if (!phone || !/^[\d\s\+\-\(\)]{7,15}$/.test(phone))         { setError('field-phone');   valid = false; }
    if (!message)                                                 { setError('field-message'); valid = false; }

    if (valid) {
      const banner = document.getElementById('successBanner');
      banner.style.display = 'flex';
      banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('message').value = '';
    }
  }
</script>

</body>
</html>
